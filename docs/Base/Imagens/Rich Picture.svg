<svg viewBox="0 0 1800 1400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Verdana, sans-serif">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b3a4a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6a4c93"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f5fa8"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b5541c"/>
    </marker>

    <g id="stick-figure">
      <circle cx="0" cy="-38" r="14" fill="#fff7ea" stroke="#2b3a4a" stroke-width="3"/>
      <line x1="0" y1="-24" x2="0" y2="22" stroke="#2b3a4a" stroke-width="3"/>
      <line x1="0" y1="-10" x2="-22" y2="10" stroke="#2b3a4a" stroke-width="3"/>
      <line x1="0" y1="-10" x2="22" y2="10" stroke="#2b3a4a" stroke-width="3"/>
      <line x1="0" y1="22" x2="-18" y2="55" stroke="#2b3a4a" stroke-width="3"/>
      <line x1="0" y1="22" x2="18" y2="55" stroke="#2b3a4a" stroke-width="3"/>
    </g>

    <g id="cloud">
      <ellipse cx="-32" cy="6" rx="30" ry="20" fill="#f1e9fb" stroke="#6a4c93" stroke-width="2.5"/>
      <ellipse cx="0" cy="-8" rx="36" ry="26" fill="#f1e9fb" stroke="#6a4c93" stroke-width="2.5"/>
      <ellipse cx="34" cy="6" rx="30" ry="20" fill="#f1e9fb" stroke="#6a4c93" stroke-width="2.5"/>
      <ellipse cx="0" cy="14" rx="56" ry="18" fill="#f1e9fb" stroke="#6a4c93" stroke-width="2.5"/>
    </g>

    <g id="building">
      <rect x="-38" y="-50" width="76" height="70" fill="#e9f4ea" stroke="#2e7d4f" stroke-width="3"/>
      <polygon points="-46,-50 0,-78 46,-50" fill="#e9f4ea" stroke="#2e7d4f" stroke-width="3"/>
      <rect x="-9" y="-9" width="18" height="29" fill="#2e7d4f"/>
      <rect x="-27" y="-34" width="12" height="14" fill="#2e7d4f"/>
      <rect x="15" y="-34" width="12" height="14" fill="#2e7d4f"/>
    </g>

    <g id="monitor">
      <rect x="-70" y="-52" width="140" height="92" rx="6" fill="#fff3df" stroke="#c07f16" stroke-width="3"/>
      <rect x="-58" y="-40" width="116" height="68" fill="#ffffff" stroke="#c07f16" stroke-width="1.5"/>
      <rect x="-20" y="40" width="40" height="10" fill="#c07f16"/>
      <rect x="-34" y="50" width="68" height="8" rx="3" fill="#c07f16"/>
    </g>

    <g id="magnifier">
      <circle cx="-4" cy="-4" r="13" fill="none" stroke="#2b3a4a" stroke-width="3"/>
      <line x1="6" y1="6" x2="16" y2="16" stroke="#2b3a4a" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g id="shield">
      <path d="M0,-32 L26,-20 L26,6 C26,26 12,38 0,44 C-12,38 -26,26 -26,6 L-26,-20 Z" fill="#e6f0fb" stroke="#1f5fa8" stroke-width="3"/>
      <path d="M-10,2 L-2,12 L14,-10" fill="none" stroke="#1f5fa8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="envelope">
      <rect x="-32" y="-20" width="64" height="42" rx="3" fill="#fdf1e7" stroke="#b5541c" stroke-width="3"/>
      <polyline points="-32,-20 0,4 32,-20" fill="none" stroke="#b5541c" stroke-width="3"/>
    </g>

    <g id="thought-tail">
      <circle cx="0" cy="0" r="6" fill="#ffffff" stroke="#2b3a4a" stroke-width="2"/>
      <circle cx="-12" cy="14" r="4" fill="#ffffff" stroke="#2b3a4a" stroke-width="2"/>
      <circle cx="-20" cy="24" r="2.5" fill="#ffffff" stroke="#2b3a4a" stroke-width="2"/>
    </g>

    <g id="conflict">
      <polygon points="0,-24 8,-4 -4,-4 4,24 -14,-2 -2,-2" fill="#e63946" stroke="#9c1c27" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1800" height="1400" fill="#faf6ee"/>
  <rect x="10" y="10" width="1780" height="1380" fill="none" stroke="#d8cdb8" stroke-width="2" stroke-dasharray="2 6"/>

  <!-- Title -->
  <text x="900" y="42" text-anchor="middle" font-size="27" font-weight="700" fill="#2b3a4a">Rich Picture — Fluxo de Busca no Portal Informa.BR (CGU)</text>
  <text x="900" y="66" text-anchor="middle" font-size="15" fill="#5a6672" font-style="italic">Técnica de Monk &amp; Howard — foco exclusivo no fluxo de busca (recuperado via Engenharia Reversa)</text>

  <!-- ===================== ROW 1: peripheral institutional stakeholders ===================== -->

  <g transform="translate(170,150)">
    <use href="#building"/>
    <text x="0" y="65" text-anchor="middle" font-size="16" font-weight="700" fill="#2e7d4f">CGU</text>
    <text x="0" y="84" text-anchor="middle" font-size="11.5" fill="#3a4550">(mantenedora)</text>
  </g>
  <g transform="translate(530,170)">
    <use href="#thought-tail" transform="translate(-235,60) rotate(20)"/>
    <ellipse cx="0" cy="0" rx="180" ry="48" fill="#ffffff" stroke="#2b3a4a" stroke-width="2"/>
    <text x="0" y="-12" text-anchor="middle" font-size="12.5" fill="#2b3a4a">"Queremos unificar, num único balcão,</text>
    <text x="0" y="6" text-anchor="middle" font-size="12.5" fill="#2b3a4a">buscas hoje fragmentadas entre Portal da</text>
    <text x="0" y="24" text-anchor="middle" font-size="12.5" fill="#2b3a4a">Transparência, Dados Abertos e a LAI."</text>
  </g>

  <g transform="translate(1650,180)">
    <use href="#building"/>
    <use href="#building" transform="translate(-70,10) scale(0.75)"/>
    <text x="-25" y="65" text-anchor="middle" font-size="16" font-weight="700" fill="#2e7d4f">Órgãos Públicos</text>
    <text x="-25" y="84" text-anchor="middle" font-size="12" fill="#3a4550">produtores/curadores</text>
    <text x="-25" y="100" text-anchor="middle" font-size="12" fill="#3a4550">dos dados de origem</text>
  </g>
  <g transform="translate(1290,170)">
    <use href="#thought-tail" transform="translate(230,60) rotate(-20) scale(-1,1)"/>
    <ellipse cx="0" cy="0" rx="180" ry="48" fill="#ffffff" stroke="#2b3a4a" stroke-width="2"/>
    <text x="0" y="-12" text-anchor="middle" font-size="12.5" fill="#2b3a4a">"Precisamos manter os dados atualizados</text>
    <text x="0" y="6" text-anchor="middle" font-size="12.5" fill="#2b3a4a">e garantir que cada resultado aponte, de</text>
    <text x="0" y="24" text-anchor="middle" font-size="12.5" fill="#2b3a4a">forma rastreável, à fonte oficial."</text>
  </g>

  <!-- ===================== ROW 2: core process ===================== -->

  <!-- Citizen demand (speech bubble) -->
  <g transform="translate(110,315)">
    <path d="M-10,-45 h330 a14,14 0 0 1 14,14 v65 a14,14 0 0 1 -14,14 h-190 l-30,32 l6,-32 h-96 a14,14 0 0 1 -14,-14 v-65 a14,14 0 0 1 14,-14 z"
          fill="#ffffff" stroke="#1f5fa8" stroke-width="2.5"/>
    <text x="155" y="-14" text-anchor="middle" font-size="14.5" fill="#17324f">"Quanto o município gastou</text>
    <text x="155" y="6" text-anchor="middle" font-size="14.5" fill="#17324f">em saúde este ano?"</text>
    <text x="155" y="26" text-anchor="middle" font-size="12" fill="#5a6672" font-style="italic">(demanda em linguagem natural)</text>
  </g>

  <!-- Citizen -->
  <g transform="translate(250,545)">
    <use href="#stick-figure" transform="scale(1.7)"/>
    <text x="0" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#1f5fa8">Cidadão</text>
    <text x="0" y="150" text-anchor="middle" font-size="12.5" fill="#3a4550">(operador central / usuário)</text>
  </g>

  <!-- Citizen thought bubble (concern about AI reliability) -->
  <g transform="translate(230,800)">
    <use href="#thought-tail" transform="translate(10,-70)"/>
    <ellipse cx="0" cy="0" rx="175" ry="55" fill="#ffffff" stroke="#2b3a4a" stroke-width="2"/>
    <text x="0" y="-16" text-anchor="middle" font-size="13" fill="#2b3a4a">"Posso confiar no resumo da IA?</text>
    <text x="0" y="4" text-anchor="middle" font-size="13" fill="#2b3a4a">Quero ver de onde vem cada</text>
    <text x="0" y="24" text-anchor="middle" font-size="13" fill="#2b3a4a">informação (rastreabilidade)."</text>
  </g>

  <!-- Validation gateway (mandatory search field rule) -->
  <g transform="translate(560,430)">
    <polygon points="0,-28 36,0 0,28 -36,0" fill="#fff0f0" stroke="#c0392b" stroke-width="2.5"/>
  </g>
  <text x="560" y="392" text-anchor="middle" font-size="12.5" fill="#c0392b" font-weight="700">campo vazio?</text>
  <text x="560" y="478" text-anchor="middle" font-size="11.5" fill="#c0392b">se sim → "Digite um termo de busca"</text>
  <text x="560" y="493" text-anchor="middle" font-size="11.5" fill="#c0392b">(mensagem de validação obrigatória)</text>

  <!-- Arrow: citizen -> gateway -> system (query) -->
  <path d="M 320 500 L 524 440" fill="none" stroke="#2b3a4a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 596 425 L 720 470" fill="none" stroke="#2b3a4a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="365" y="470" font-size="12.5" fill="#2b3a4a">digita a busca</text>

  <!-- Arrow: system -> citizen (results with sources) -->
  <path d="M 720 540 L 330 570" fill="none" stroke="#2b3a4a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="440" y="600" font-size="12.5" fill="#2b3a4a">resumo + links das fontes</text>

  <!-- System / Informa.BR (with AI) -->
  <g transform="translate(800,505)">
    <use href="#monitor"/>
    <use href="#magnifier" transform="translate(-30,-14) scale(1.3)"/>
    <text x="0" y="70" text-anchor="middle" font-size="17" font-weight="700" fill="#c07f16">Informa.BR</text>
    <text x="0" y="88" text-anchor="middle" font-size="12.5" fill="#3a4550">motor de busca com IA</text>
  </g>

  <!-- System thought bubble (traceability rule) -->
  <g transform="translate(1080,330)">
    <use href="#thought-tail" transform="translate(-90,110)"/>
    <ellipse cx="0" cy="0" rx="180" ry="48" fill="#ffffff" stroke="#2b3a4a" stroke-width="2"/>
    <text x="0" y="-12" text-anchor="middle" font-size="13" fill="#2b3a4a">"Preciso indicar a origem/fonte de</text>
    <text x="0" y="6" text-anchor="middle" font-size="13" fill="#2b3a4a">cada resultado retornado — regra de</text>
    <text x="0" y="24" text-anchor="middle" font-size="13" fill="#2b3a4a">negócio de rastreabilidade."</text>
  </g>

  <!-- Data source clouds -->
  <g transform="translate(660,800)">
    <use href="#cloud" transform="scale(1.15)"/>
    <text x="0" y="45" text-anchor="middle" font-size="12" font-weight="600" fill="#6a4c93">Portal da</text>
    <text x="0" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#6a4c93">Transparência</text>
  </g>
  <g transform="translate(830,845)">
    <use href="#cloud" transform="scale(1.15)"/>
    <text x="0" y="45" text-anchor="middle" font-size="12" font-weight="600" fill="#6a4c93">Portal de Dados</text>
    <text x="0" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#6a4c93">Abertos</text>
  </g>
  <g transform="translate(1000,800)">
    <use href="#cloud" transform="scale(1.15)"/>
    <text x="0" y="45" text-anchor="middle" font-size="12" font-weight="600" fill="#6a4c93">Respostas LAI /</text>
    <text x="0" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#6a4c93">Fala.BR</text>
  </g>
  <path d="M 670 758 L 775 578" fill="none" stroke="#6a4c93" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-purple)"/>
  <path d="M 830 800 L 800 578" fill="none" stroke="#6a4c93" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-purple)"/>
  <path d="M 990 758 L 830 578" fill="none" stroke="#6a4c93" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-purple)"/>

  <!-- SSO login (Fazer Pedido branch) -->
  <g transform="translate(1350,505)">
    <use href="#shield"/>
    <text x="0" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#1f5fa8">Login Único</text>
    <text x="0" y="88" text-anchor="middle" font-size="12.5" fill="#3a4550">(SSO gov.br)</text>
  </g>
  <path d="M 875 495 L 1300 500" fill="none" stroke="#1f5fa8" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-blue)"/>
  <text x="1090" y="440" text-anchor="middle" font-size="12" fill="#1f5fa8">"Não encontrei" → clica em "Fazer Pedido"</text>
  <text x="1090" y="424" text-anchor="middle" font-size="11" fill="#5a6672" font-style="italic">(exige autenticação; a busca em si é livre a qualquer visitante)</text>

  <!-- Conflict: instant expectation vs legal deadline -->
  <g transform="translate(1220,660)">
    <use href="#conflict" transform="scale(1.7)"/>
  </g>
  <text x="1220" y="720" text-anchor="middle" font-size="12" fill="#9c1c27" font-weight="700">tensão</text>
  <g transform="translate(1480,690)">
    <ellipse cx="0" cy="0" rx="200" ry="58" fill="#fff5f5" stroke="#c0392b" stroke-width="2"/>
    <text x="0" y="-18" text-anchor="middle" font-size="12.5" fill="#9c1c27">Cidadão espera resposta imediata,</text>
    <text x="0" y="0" text-anchor="middle" font-size="12.5" fill="#9c1c27">mas o pedido formal via LAI tem prazo</text>
    <text x="0" y="18" text-anchor="middle" font-size="12.5" fill="#9c1c27">legal de até 20 dias (+10 prorrogável)</text>
  </g>

  <!-- ===================== ROW 3: Support ===================== -->
  <g transform="translate(800,1080)">
    <use href="#envelope"/>
    <text x="0" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="#b5541c">Suporte Informa.BR</text>
    <text x="0" y="63" text-anchor="middle" font-size="12" fill="#3a4550">suporte.informabr@cgu.gov.br</text>
  </g>
  <path d="M 200 850 C 150 970 450 1050 760 1078" fill="none" stroke="#b5541c" stroke-width="2.2" stroke-dasharray="5 5" marker-end="url(#arrow-orange)"/>
  <text x="260" y="970" font-size="12" fill="#b5541c">dúvidas / falhas no atendimento</text>

  <!-- Legend -->
  <g transform="translate(60,1250)">
    <rect x="-20" y="-30" width="1690" height="110" fill="#ffffff" stroke="#d8cdb8" stroke-width="1.5" rx="8"/>
    <text x="0" y="-8" font-size="14" font-weight="700" fill="#2b3a4a">Legenda</text>
    <line x1="0" y1="18" x2="42" y2="18" stroke="#2b3a4a" stroke-width="3"/>
    <text x="50" y="23" font-size="12.5" fill="#2b3a4a">fluxo direto de interação (busca / resultado)</text>
    <line x1="0" y1="46" x2="42" y2="46" stroke="#6a4c93" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="50" y="51" font-size="12.5" fill="#2b3a4a">consulta às fontes de dados oficiais</text>

    <use href="#thought-tail" transform="translate(690,12) scale(1)"/>
    <ellipse cx="740" cy="6" rx="18" ry="11" fill="#fff" stroke="#2b3a4a" stroke-width="1.5"/>
    <text x="768" y="11" font-size="12.5" fill="#2b3a4a">balão de pensamento — preocupação/objetivo de um stakeholder</text>

    <use href="#cloud" transform="translate(740,46) scale(0.5)"/>
    <text x="785" y="51" font-size="12.5" fill="#2b3a4a">fonte de dados / sistema externo</text>

    <use href="#conflict" transform="translate(1350,10) scale(0.9)"/>
    <text x="1372" y="15" font-size="12.5" fill="#2b3a4a">ponto de tensão/conflito entre stakeholders</text>

    <use href="#shield" transform="translate(1350,46) scale(0.5)"/>
    <text x="1372" y="51" font-size="12.5" fill="#2b3a4a">controle de autenticação (SSO)</text>
  </g>

</svg>
